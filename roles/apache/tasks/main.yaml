---
- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present
  notify: Restart Apache

- name: Check of apache draait
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Check status
  ansible.builtin.command: systemctl is-active apache2
  register: apache2_status
  changed_when: false

- name: Print Apache status
  ansible.builtin.debug:
    msg: "Apache2 service is {{ apache2_status.stdout }}"



